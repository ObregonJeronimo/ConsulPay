<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F4EE" />

    <!-- El manifest no es decorativo: en iPhone el push web SOLO funciona si
         la app se agrego a la pantalla de inicio, y para eso hace falta un
         manifest con display standalone. En Android y escritorio no es
         obligatorio, pero mejora como se ve al instalarla. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ConsulPay" />
    <meta name="description" content="ConsulPay — Gestión de consultorios y pagos de profesionales" />
    <title>ConsulPay</title>

    <!-- Preconnects: abren TCP+TLS antes de que el JS los necesite.
         Lighthouse marcó estos 3 como candidatos con ahorros de 290-400ms c/u.
         firebaseapp.com: iframe de auth de Firebase (se carga siempre).
         googleapis.com / firestore.googleapis.com: llamadas de auth y Firestore. -->
    <link rel="preconnect" href="https://consulpay-b84f0.firebaseapp.com" crossorigin />
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://apis.google.com" crossorigin />

    <!-- Fonts -->
    <!-- preconnect: ahorra ~100ms abriendo TCP+TLS antes de pedir el CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Carga no-bloqueante de Google Fonts:
         media=print hace que el browser baje el CSS pero NO lo aplique
         hasta que termina. onload lo cambia a 'all' una vez listo. Asi
         el render no se bloquea esperando la fuente. La <noscript> es
         para clientes con JS desactivado (raro pero correcto). -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
